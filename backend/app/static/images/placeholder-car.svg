<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E1117"/>
      <stop offset="100%" stop-color="#161B24"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A96E"/>
      <stop offset="100%" stop-color="#D4B896"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Ground line -->
  <line x1="60" y1="195" x2="340" y2="195" stroke="#1E293B" stroke-width="1"/>
  <!-- Car body -->
  <g transform="translate(100, 70)">
    <path d="M25 90 L50 40 Q55 30 65 30 L140 30 Q150 30 155 40 L185 90" fill="url(#body)" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="10" y="90" width="185" height="35" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
    <!-- Windows -->
    <path d="M58 38 L70 82 L130 82 L142 38 Z" fill="#0F172A" stroke="#475569" stroke-width="1" opacity="0.8"/>
    <line x1="100" y1="38" x2="100" y2="82" stroke="#475569" stroke-width="0.8"/>
    <!-- Window reflection -->
    <path d="M62 42 L72 78 L85 78 L75 42 Z" fill="#C8A96E" opacity="0.08"/>
    <!-- Wheels -->
    <circle cx="50" cy="125" r="20" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="50" cy="125" r="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <circle cx="50" cy="125" r="4" fill="#475569"/>
    <circle cx="155" cy="125" r="20" fill="#0F172A" stroke="#334155" stroke-width="2"/>
    <circle cx="155" cy="125" r="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <circle cx="155" cy="125" r="4" fill="#475569"/>
    <!-- Headlight -->
    <rect x="182" y="94" width="12" height="8" rx="2" fill="#C8A96E" opacity="0.6"/>
    <!-- Taillight -->
    <rect x="10" y="94" width="10" height="6" rx="2" fill="#EF4444" opacity="0.5"/>
    <!-- Door line -->
    <line x1="100" y1="42" x2="100" y2="118" stroke="#475569" stroke-width="0.5" opacity="0.5"/>
  </g>
  <!-- Brand text -->
  <text x="200" y="245" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="12" font-weight="600">CarNeRF</text>
  <!-- Subtle accent line -->
  <rect x="175" y="255" width="50" height="2" rx="1" fill="url(#accent)" opacity="0.3"/>
</svg>
