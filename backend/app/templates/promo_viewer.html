<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>CarNeRF — 3D Gaussian Splatting Demo</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/",
    "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
  }
}
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Pretendard', sans-serif; color: #fff; }
#viewer { width: 100vw; height: 100vh; background: #000; }
.brand {
  position: fixed; top: 24px; left: 24px; z-index: 10;
  font-size: 16px; font-weight: 800; letter-spacing: -0.5px;
  color: #fff; opacity: 0.85;
}
.brand .accent { color: #C8A96E; }
.tag {
  position: fixed; top: 24px; right: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  color: #C8A96E; font-weight: 600;
}
.controls {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  z-index: 10; display: flex; gap: 8px;
}
.btn {
  background: rgba(0,0,0,0.6); backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12); color: #ddd;
  padding: 10px 18px; border-radius: 999px; font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  font-family: inherit;
}
.btn:hover { color: #fff; border-color: rgba(200,169,110,0.4); }
.btn.active { background: rgba(200,169,110,0.15); color: #C8A96E; border-color: rgba(200,169,110,0.4); }
#loading {
  position: fixed; inset: 0; z-index: 20;
  background: #000;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.6s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.spinner {
  width: 36px; height: 36px;
  border: 2px solid rgba(200,169,110,0.2);
  border-top-color: #C8A96E;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-bottom: 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-label { color: #fff; font-size: 14px; font-weight: 600; }
.loading-sub { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 4px; }
.hint {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  z-index: 9; color: rgba(255,255,255,0.4); font-size: 11px;
  letter-spacing: 1px; text-transform: uppercase; pointer-events: none;
}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div class="loading-label">3D 모델 로딩 중</div>
  <div class="loading-sub">695 MB - 잠시만 기다려주세요</div>
</div>

<div class="brand">Car<span class="accent">NeRF</span></div>
<div class="tag">3D Gaussian Splatting</div>

<div id="viewer"></div>

<div class="controls">
  <button class="btn active" id="btn-rotate" onclick="toggleRotate()">자동 회전 ON</button>
  <button class="btn" onclick="resetCam()">카메라 초기화</button>
  <button class="btn" onclick="toggleFull()">전체화면</button>
</div>

<div class="hint">마우스 드래그 회전 · 스크롤 줌 · F 전체화면</div>

<script type="module">
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';
import * as THREE from 'three';

const container = document.getElementById('viewer');
const loadingEl = document.getElementById('loading');

const viewer = new GaussianSplats3D.Viewer({
  rootElement: container,
  cameraUp: [0, -1, 0],
  initialCameraPosition: [3.5, -2, 5.5],
  initialCameraLookAt: [0, 0, 0],
  sphericalHarmonicsDegree: 2,
  splatRenderMode: GaussianSplats3D.SplatRenderMode.ThreeD,
  ignoreDevicePixelRatio: false,
  antialiased: true,
  sharedMemoryForWorkers: false,
});

viewer.addSplatScene('/static/models/nf_sonata/model.ply', {
  splatAlphaRemovalThreshold: 5,
  showLoadingUI: false,
  position: [0, 0, 0],
  rotation: [0, 0, 0, 1],
  scale: [1, 1, 1],
}).then(() => {
  loadingEl.classList.add('hidden');
  viewer.start();
  // start auto-rotating
  state.rotating = true;
  applyAutoRotate();
}).catch(err => {
  loadingEl.querySelector('.loading-label').textContent = '로딩 실패';
  loadingEl.querySelector('.loading-sub').textContent = err.message || String(err);
  console.error(err);
});

const state = { rotating: true };

function applyAutoRotate() {
  const ctrls = viewer.controls;
  if (ctrls && 'autoRotate' in ctrls) {
    ctrls.autoRotate = state.rotating;
    ctrls.autoRotateSpeed = 1.5;
  }
}

window.toggleRotate = function() {
  state.rotating = !state.rotating;
  applyAutoRotate();
  const btn = document.getElementById('btn-rotate');
  btn.classList.toggle('active', state.rotating);
  btn.textContent = state.rotating ? '자동 회전 ON' : '자동 회전 OFF';
};

window.resetCam = function() {
  if (viewer.camera) {
    viewer.camera.position.set(3.5, -2, 5.5);
    viewer.camera.lookAt(0, 0, 0);
  }
};

window.toggleFull = function() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};

document.addEventListener('keydown', (e) => {
  if (e.key === 'f' || e.key === 'F') window.toggleFull();
  if (e.key === 'r' || e.key === 'R') window.toggleRotate();
  if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
});
</script>
</body>
</html>
