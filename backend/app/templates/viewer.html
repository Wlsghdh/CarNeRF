<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 뷰어 - {{ vehicle.brand }} {{ vehicle.model }} | CarNeRF</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HJF6M3KEL5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-HJF6M3KEL5');
    </script>
    <!-- Microsoft Clarity -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "w8v7w04l4c");
    </script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/",
            "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"
        }
    }
    </script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #07090F; overflow: hidden; font-family: 'Pretendard', sans-serif; }
        #viewer-fullscreen { width: 100vw; height: 100vh; }
        .overlay-info {
            position: fixed; top: 16px; left: 16px;
            background: rgba(14,17,23,0.85); backdrop-filter: blur(16px);
            color: white; padding: 14px 22px; border-radius: 14px;
            font-size: 14px; z-index: 10;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .overlay-info h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .overlay-info p { font-size: 12px; color: rgba(255,255,255,0.5); }
        .back-btn {
            position: fixed; top: 16px; right: 16px;
            background: rgba(14,17,23,0.85); backdrop-filter: blur(16px);
            color: white; padding: 10px 18px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1); font-size: 13px; font-weight: 600;
            cursor: pointer; z-index: 10; text-decoration: none;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            transition: all 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        .back-btn:hover { background: rgba(14,17,23,0.95); border-color: rgba(200,169,110,0.3); }
        .viewer-controls {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 10;
        }
        .viewer-ctrl-btn {
            background: rgba(14,17,23,0.85); backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.1); color: #94A3B8;
            padding: 10px 16px; border-radius: 10px; font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
        }
        .viewer-ctrl-btn:hover { color: #E2E8F0; border-color: rgba(200,169,110,0.3); }
        .viewer-ctrl-btn.active { color: #C8A96E; border-color: rgba(200,169,110,0.4); background: rgba(200,169,110,0.1); }
        .placeholder-msg {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white; z-index: 5;
            background: #07090F;
        }
        .placeholder-msg svg { width: 56px; height: 56px; color: #C8A96E; margin-bottom: 16px; opacity: 0.6; }
        .placeholder-msg h3 { font-size: 20px; font-weight: 700; color: #E2E8F0; }
        .placeholder-msg p { font-size: 14px; color: #64748B; margin-top: 6px; }
        @keyframes pulse { 0%,100%{opacity:0.6} 50%{opacity:1} }
        .placeholder-msg svg { animation: pulse 2s ease-in-out infinite; }
    </style>
</head>
<body>
    <div class="overlay-info">
        <h2>{{ vehicle.brand }} {{ vehicle.model }}</h2>
        <p>{{ vehicle.year }}년 {{ vehicle.trim or '' }} | 마우스로 회전, 스크롤로 확대</p>
    </div>
    <a href="/vehicles/{{ vehicle.id }}" class="back-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
        상세 페이지로
    </a>

    {% if vehicle.model_3d_status == 'ready' %}
    <div id="viewer-fullscreen"></div>
    <div class="viewer-controls">
        <button class="viewer-ctrl-btn" id="toggle-defects-btn" onclick="toggleDefects()" title="AI 결함 표시">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126z"/></svg>
            AI 결함
            <span id="defect-count-badge" style="display:none;background:#EF4444;color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;"></span>
        </button>
        <button class="viewer-ctrl-btn" id="auto-rotate-btn" onclick="toggleAutoRotate()" title="자동 회전">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 00-3.7-3.7 48.678 48.678 0 00-7.324 0 4.006 4.006 0 00-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3l-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 003.7 3.7 48.656 48.656 0 007.324 0 4.006 4.006 0 003.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3l-3 3"/></svg>
            회전
        </button>
        <button class="viewer-ctrl-btn" onclick="resetCamera()" title="카메라 초기화">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182"/></svg>
            초기화
        </button>
    </div>
    {% else %}
    <div class="placeholder-msg">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21 7.5l-2.25-1.313M21 7.5v2.25m0-2.25l-2.25 1.313M3 7.5l2.25-1.313M3 7.5l2.25 1.313M3 7.5v2.25m9 3l2.25-1.313M12 12.75l-2.25-1.313M12 12.75V15m0 6.75l2.25-1.313M12 21.75V19.5m0 2.25l-2.25-1.313m0-16.875L12 2.25l2.25 1.313M21 14.25v2.25l-2.25 1.313m-13.5 0L3 16.5v-2.25" /></svg>
        <h3>3D 스캔 준비 중</h3>
        <p>이 차량의 3D 모델이 곧 준비됩니다</p>
    </div>
    {% endif %}

    {% if vehicle.model_3d_status == 'ready' %}
    <script type="module">
        import { initViewer, initDefectMarkers, toggleDefectMarkers } from '/static/js/viewer.js';
        const viewerInstance = initViewer('viewer-fullscreen', {
            modelUrl: '{{ vehicle.model_3d_url }}',
            autoRotate: false,
            backgroundColor: 0x07090F,
        });

        // 결함 마커 초기화
        initDefectMarkers({{ vehicle.id }});

        let _autoRotating = false;

        window.resetCamera = function() {
            const viewer = viewerInstance?.getViewer();
            if (viewer && viewer.camera) {
                viewer.camera.position.set(5, -3, 8);
                viewer.camera.lookAt(0, 0, 0);
            }
        };

        window.toggleDefects = function() {
            const visible = toggleDefectMarkers();
            const btn = document.getElementById('toggle-defects-btn');
            if (btn) btn.classList.toggle('active', visible);
        };

        window.toggleAutoRotate = function() {
            _autoRotating = !_autoRotating;
            const viewer = viewerInstance?.getViewer();
            if (viewer && viewer.controls && 'autoRotate' in viewer.controls) {
                viewer.controls.autoRotate = _autoRotating;
                viewer.controls.autoRotateSpeed = 1.5;
            }
            const btn = document.getElementById('auto-rotate-btn');
            if (btn) btn.classList.toggle('active', _autoRotating);
        };
    </script>
    {% endif %}
</body>
</html>
