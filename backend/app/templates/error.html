{% extends "base.html" %}
{% block title %}{{ error_code }} - {{ error_title }}{% endblock %}

{% block content %}
<div style="min-height:70vh;display:flex;align-items:center;justify-content:center;padding:80px 24px;background:#000;">
  <div style="text-align:center;max-width:480px;">
    <div style="font-size:140px;font-weight:900;color:#fff;letter-spacing:-4px;line-height:1;">{{ error_code }}</div>
    <div style="width:40px;height:2px;background:#C8A96E;margin:24px auto;"></div>
    <h1 style="font-size:24px;font-weight:800;color:#fff;margin:0 0 12px;letter-spacing:-0.5px;">{{ error_title }}</h1>
    <p style="font-size:14px;color:#999;line-height:1.8;margin-bottom:36px;">{{ error_message }}</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
      <a href="/" aria-label="홈으로 이동" style="display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;background:#fff;color:#000;transition:opacity 0.2s;" onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        홈으로
      </a>
      <a href="/listings" aria-label="매물 검색 페이지로 이동" style="display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:8px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid rgba(255,255,255,0.2);color:#fff;background:transparent;transition:all 0.2s;" onmouseover="this.style.borderColor='#C8A96E';this.style.color='#C8A96E'" onmouseout="this.style.borderColor='rgba(255,255,255,0.2)';this.style.color='#fff'">
        매물 검색
      </a>
    </div>
  </div>
</div>
{% endblock %}
