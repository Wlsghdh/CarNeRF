{% extends "base.html" %}
{% block title %}로그인{% endblock %}

{% block head %}
<style>
:root {
  --bg:      #07090F;
  --surface: #0E1117;
  --sur2:    #161B24;
  --border:  rgba(255,255,255,0.08);
  --accent:  #C8A96E;
  --text:    #E2E8F0;
  --muted:   #64748B;
}
html:not(.dark) {
  --bg:      #F8FAFC;
  --surface: #FFFFFF;
  --sur2:    #F1F5F9;
  --border:  rgba(0,0,0,0.08);
  --text:    #1E293B;
  --muted:   #64748B;
}
body { background: var(--bg) !important; color: var(--text) !important; }

/* Background pattern */
.login-bg {
  position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
}
.login-bg::before {
  content: '';
  position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
  background: radial-gradient(ellipse at 30% 20%, rgba(200,169,110,0.06) 0%, transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(212,180,120,0.04) 0%, transparent 50%);
  animation: bgShift 20s ease-in-out infinite alternate;
}
@keyframes bgShift {
  0% { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(-3%, 2%) rotate(3deg); }
}
.login-bg-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
  -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
}

.login-wrap {
  max-width: 440px; margin: 0 auto;
  padding: 100px 24px 60px;
  position: relative; z-index: 1;
}

/* Logo section */
.login-logo {
  text-align: center; margin-bottom: 40px;
}
.login-logo .icon {
  width: 56px; height: 56px; background: linear-gradient(135deg, #C8A96E, #D4B896);
  border-radius: 16px; display: inline-flex; align-items: center;
  justify-content: center; font-size: 15px; font-weight: 900; color: #fff;
  margin-bottom: 16px;
  box-shadow: 0 8px 32px rgba(200,169,110,0.25);
  animation: logoFloat 4s ease-in-out infinite;
}
@keyframes logoFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
.login-logo h1 {
  font-size: 28px; font-weight: 900; color: var(--text);
  letter-spacing: -0.5px;
}
.login-logo h1 span { color: var(--accent); }
.login-logo p {
  font-size: 14px; color: var(--muted); margin-top: 6px;
  line-height: 1.5;
}

/* Card */
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 4px 40px rgba(0,0,0,0.2), 0 0 0 1px rgba(255,255,255,0.03) inset;
  backdrop-filter: blur(20px);
  animation: cardEnter 0.5s ease-out;
}
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

/* Tabs */
.tab-row {
  display: flex; position: relative;
  border-bottom: 1px solid var(--border);
  background: var(--sur2);
}
.tab-slider {
  position: absolute; bottom: -1px; height: 2px;
  background: var(--accent);
  width: 50%; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 0 12px rgba(200,169,110,0.4);
}
.tab-slider[data-tab="register"] { transform: translateX(100%); }
.tab-btn {
  flex: 1; padding: 16px; font-size: 13px; font-weight: 600;
  color: var(--muted); background: none; border: none; cursor: pointer;
  transition: all 0.3s; position: relative; z-index: 1;
  letter-spacing: 0.3px;
}
.tab-btn.active { color: var(--accent); }
.tab-btn:hover:not(.active) { color: var(--text); }

/* Forms */
.form-inner {
  padding: 28px;
  animation: formFade 0.35s ease-out;
}
@keyframes formFade {
  from { opacity: 0; transform: translateX(8px); }
  to { opacity: 1; transform: translateX(0); }
}

.field { margin-bottom: 18px; position: relative; }
.field label {
  display: block; font-size: 11px; font-weight: 600;
  color: var(--muted); margin-bottom: 8px;
  text-transform: uppercase; letter-spacing: 0.8px;
  transition: color 0.2s;
}
.field:focus-within label { color: var(--accent); }

.dk-input {
  width: 100%; background: var(--sur2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; font-size: 13px;
  color: var(--text); outline: none;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: inherit;
}
.dk-input::placeholder { color: var(--muted); opacity: 0.6; }
.dk-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(200,169,110,0.12), 0 0 20px rgba(200,169,110,0.05);
  background: rgba(200,169,110,0.02);
}
.dk-input:hover:not(:focus) { border-color: rgba(255,255,255,0.15); }

/* Password strength */
.pw-strength {
  height: 3px; border-radius: 3px; margin-top: 8px; transition: all 0.3s;
  background: var(--border); overflow: hidden;
}
.pw-strength-fill {
  height: 100%; border-radius: 3px;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%;
}
.pw-hint {
  font-size: 11px; color: var(--muted); margin-top: 6px;
  font-weight: 500; transition: color 0.3s;
}

/* Messages */
.msg-box {
  display: none; padding: 12px 16px; border-radius: 10px;
  font-size: 13px; margin-bottom: 14px;
  animation: msgSlide 0.3s ease-out;
  display: none;
}
@keyframes msgSlide {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg-error {
  background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.15);
  color: #EF4444;
}
.msg-error::before {
  content: ''; display: inline-block; width: 6px; height: 6px;
  background: #EF4444; border-radius: 50%; margin-right: 8px;
  vertical-align: middle;
}
.msg-success {
  background: rgba(16,185,129,0.06); border: 1px solid rgba(16,185,129,0.15);
  color: #10B981;
}
.msg-success::before {
  content: ''; display: inline-block; width: 6px; height: 6px;
  background: #10B981; border-radius: 50%; margin-right: 8px;
  vertical-align: middle;
}

/* Submit button */
.btn-submit {
  width: 100%; padding: 13px; border-radius: 12px; border: none;
  background: linear-gradient(135deg, #C8A96E, #0284C7);
  color: #fff; font-size: 14px;
  font-weight: 700; cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 4px 16px rgba(200,169,110,0.25);
  position: relative; overflow: hidden;
}
.btn-submit::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
  transform: translateX(-100%);
  transition: transform 0.6s;
}
.btn-submit:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(200,169,110,0.35);
}
.btn-submit:hover::after { transform: translateX(100%); }
.btn-submit:active { transform: translateY(0); }
.btn-submit.loading {
  pointer-events: none; opacity: 0.8;
}

/* Divider */
.auth-divider {
  display: flex; align-items: center; gap: 14px;
  margin: 20px 0;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border);
}
.auth-divider span {
  font-size: 11px; color: var(--muted); font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.5px;
}

/* Social buttons */
.social-buttons {
  display: flex; gap: 10px;
}
.btn-social {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px; border-radius: 10px;
  background: var(--sur2); border: 1px solid var(--border);
  color: var(--text); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  text-decoration: none;
}
.btn-social:hover {
  border-color: rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.04);
  transform: translateY(-1px);
}
.btn-social svg { flex-shrink: 0; }

/* Demo info */
.demo-info {
  margin-top: 18px; padding: 12px 16px; border-radius: 10px;
  background: rgba(212,180,120,0.04); border: 1px solid rgba(212,180,120,0.1);
  font-size: 12px; color: var(--muted); text-align: center;
  line-height: 1.7;
}
.demo-info code {
  font-family: 'SF Mono', 'Fira Code', monospace; background: var(--sur2);
  padding: 2px 8px; border-radius: 5px; font-size: 11px;
  color: var(--text); border: 1px solid var(--border);
}

/* Bottom links */
.login-footer {
  text-align: center; margin-top: 24px;
  font-size: 13px; color: var(--muted);
}
.login-footer a {
  color: var(--accent); text-decoration: none; font-weight: 600;
  transition: opacity 0.2s;
}
.login-footer a:hover { opacity: 0.8; }
</style>
{% endblock %}

{% block content %}
<div class="login-bg">
  <div class="login-bg-grid"></div>
</div>

<div class="login-wrap">
  <div class="login-logo">
    <div class="icon">3D</div>
    <h1>Car<span>NeRF</span></h1>
    <p>AI 중고차 3D 분석 플랫폼에 오신 것을 환영합니다</p>
  </div>

  <div class="login-card">
    <div class="tab-row">
      <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">로그인</button>
      <button id="tab-register" class="tab-btn" onclick="switchTab('register')">회원가입</button>
      <div id="tab-slider" class="tab-slider" data-tab="login"></div>
    </div>

    <!-- Login Form -->
    <form id="login-form" class="form-inner">
      <div class="field">
        <label>이메일</label>
        <input type="email" name="email" required placeholder="이메일을 입력하세요" class="dk-input">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" name="password" required placeholder="비밀번호를 입력하세요" class="dk-input">
      </div>
      <div id="login-error" class="msg-box msg-error"></div>
      <button type="submit" class="btn-submit">로그인</button>

      <div class="auth-divider"><span>또는</span></div>

      <div class="social-buttons">
        <button type="button" class="btn-social" onclick="alert('카카오 로그인은 준비 중입니다.')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#FEE500"><path d="M12 3C6.477 3 2 6.463 2 10.691c0 2.727 1.804 5.119 4.51 6.476l-.924 3.386c-.082.3.258.549.522.381l3.89-2.572c.647.09 1.313.138 1.991.138 5.523 0 10-3.463 10-7.809S17.523 3 12 3z"/></svg>
          카카오
        </button>
        <button type="button" class="btn-social" onclick="alert('네이버 로그인은 준비 중입니다.')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#03C75A"><path d="M13.37 12.196l-3.066-4.56H6v8.728h4.63v-4.564l3.066 4.564H18V7.636h-4.63z"/></svg>
          네이버
        </button>
        <button type="button" class="btn-social" onclick="alert('Google 로그인은 준비 중입니다.')">
          <svg width="14" height="14" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google
        </button>
      </div>

      <div class="demo-info">
        체험용 계정: <code>demo@carnerf.kr</code> / <code>demo1234</code>
      </div>
    </form>

    <!-- Register Form -->
    <form id="register-form" class="form-inner" style="display:none;">
      <div class="field">
        <label>이름</label>
        <input type="text" name="username" required minlength="2" placeholder="홍길동" class="dk-input">
      </div>
      <div class="field">
        <label>이메일</label>
        <input type="email" name="email" required placeholder="user@example.com" class="dk-input">
      </div>
      <div class="field">
        <label>비밀번호</label>
        <input type="password" name="password" id="reg-password" required minlength="6" placeholder="6자 이상" class="dk-input" oninput="checkPasswordStrength(this.value)">
        <div class="pw-strength"><div id="pw-strength-fill" class="pw-strength-fill"></div></div>
        <div id="pw-hint" class="pw-hint"></div>
      </div>
      <div class="field">
        <label>비밀번호 확인</label>
        <input type="password" name="password_confirm" id="reg-password-confirm" required placeholder="비밀번호를 다시 입력하세요" class="dk-input">
      </div>
      <div class="field">
        <label>전화번호 (선택)</label>
        <input type="tel" name="phone" placeholder="010-1234-5678" class="dk-input">
      </div>
      <div id="register-error" class="msg-box msg-error"></div>
      <div id="register-success" class="msg-box msg-success"></div>
      <button type="submit" class="btn-submit">회원가입</button>

      <div class="login-footer" style="margin-top:18px;">
        이미 계정이 있으신가요? <a href="#" onclick="switchTab('login');return false;">로그인</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function switchTab(tab) {
  const loginForm = document.getElementById('login-form');
  const registerForm = document.getElementById('register-form');
  const slider = document.getElementById('tab-slider');

  loginForm.style.display = tab === 'login' ? '' : 'none';
  registerForm.style.display = tab === 'register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  slider.setAttribute('data-tab', tab);

  // Re-trigger form animation
  const activeForm = tab === 'login' ? loginForm : registerForm;
  activeForm.style.animation = 'none';
  activeForm.offsetHeight;
  activeForm.style.animation = '';
}

const params = new URLSearchParams(window.location.search);
if (params.get('tab') === 'register') switchTab('register');

function checkPasswordStrength(pw) {
  const fill = document.getElementById('pw-strength-fill');
  const hint = document.getElementById('pw-hint');
  let score = 0;
  if (pw.length >= 6) score++;
  if (pw.length >= 8) score++;
  if (/[A-Z]/.test(pw)) score++;
  if (/[0-9]/.test(pw)) score++;
  if (/[^A-Za-z0-9]/.test(pw)) score++;

  const pct = Math.min(score * 20, 100);
  fill.style.width = pct + '%';

  if (score <= 1) { fill.style.background = '#EF4444'; hint.textContent = '약함'; hint.style.color = '#EF4444'; }
  else if (score <= 2) { fill.style.background = '#F59E0B'; hint.textContent = '보통'; hint.style.color = '#F59E0B'; }
  else if (score <= 3) { fill.style.background = '#C8A96E'; hint.textContent = '양호'; hint.style.color = '#C8A96E'; }
  else { fill.style.background = '#10B981'; hint.textContent = '강함'; hint.style.color = '#10B981'; }

  if (!pw) { fill.style.width = '0%'; hint.textContent = ''; }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const err = document.getElementById('login-error');
  const btn = form.querySelector('.btn-submit');
  err.style.display = 'none';
  btn.classList.add('loading');
  btn.textContent = '로그인 중...';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: form.email.value, password: form.password.value }),
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.detail || '로그인에 실패했습니다.'; err.style.display = 'block'; btn.classList.remove('loading'); btn.textContent = '로그인'; return; }
    const redirect = params.get('next') || '/';
    window.location.href = redirect;
  } catch { err.textContent = '서버 오류가 발생했습니다.'; err.style.display = 'block'; btn.classList.remove('loading'); btn.textContent = '로그인'; }
});

document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const err = document.getElementById('register-error');
  const ok = document.getElementById('register-success');
  const btn = form.querySelector('.btn-submit');
  err.style.display = 'none'; ok.style.display = 'none';

  // 비밀번호 확인
  if (form.password.value !== form.password_confirm.value) {
    err.textContent = '비밀번호가 일치하지 않습니다.'; err.style.display = 'block'; return;
  }
  if (form.password.value.length < 6) {
    err.textContent = '비밀번호는 6자 이상이어야 합니다.'; err.style.display = 'block'; return;
  }

  btn.classList.add('loading');
  btn.textContent = '가입 처리 중...';
  try {
    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        username: form.username.value,
        email: form.email.value,
        password: form.password.value,
        phone: form.phone.value || null,
      }),
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.detail || '회원가입에 실패했습니다.'; err.style.display = 'block'; btn.classList.remove('loading'); btn.textContent = '회원가입'; return; }
    ok.textContent = '회원가입이 완료되었습니다! 로그인해주세요.'; ok.style.display = 'block';
    btn.classList.remove('loading'); btn.textContent = '회원가입';
    setTimeout(() => switchTab('login'), 1500);
  } catch { err.textContent = '서버 오류가 발생했습니다.'; err.style.display = 'block'; btn.classList.remove('loading'); btn.textContent = '회원가입'; }
});
</script>
{% endblock %}
